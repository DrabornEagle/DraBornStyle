name: One-time branch cleanup

on:
  push:
    branches:
      - cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete branches
        run: |
          for branch in \
            archive/legacy-release-v0.2 \
            archive/ui-demo-v0.3 \
            work/v0.3-build \
            work/v0.3-build-copy \
            work/v0.3-payload \
            work/v0.3-payload-staging; do
            git push origin --delete "$branch" || true
          done
          git push origin --delete cleanup-trigger || true
