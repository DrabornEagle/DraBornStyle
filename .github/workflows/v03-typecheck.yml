name: Final temporary branch cleanup

on:
  push:
    branches:
      - cleanup-final

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete verification branches
        run: |
          git push origin --delete verify-v03-trigger || true
          git push origin --delete cleanup-final || true
